// The protobuf twin of idl.go: the same UserService contract, for projects that
// need gRPC. gRPC's wire types and registration stubs come from protobuf, so a
// gRPC project starts from this file rather than from the Go IDL:
//
//	microgen -idl examples/usersvc/userservice.proto \
//	  -out ./usersvc -import example.com/usersvc -protocols http,grpc
//	protoc --go_out=. --go-grpc_out=. pb/userservice/userservice.proto
//
// The HTTP-only project can be generated from either file.
syntax = "proto3";

package api.v1.userservice;

option go_package = "./pb";

// UserService is the user service contract.
service UserService {
  // CreateUser creates a user.
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  // GetUser returns one user.
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  // UpdateUser updates a user.
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  // DeleteUser removes a user.
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
  // ListUsers pages through users.
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
}

message User {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  int32 age = 4;
  int32 status = 5;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  int32 age = 3;
}

message CreateUserResponse {
  User user = 1;
  string error = 2;
}

message GetUserRequest {
  uint64 id = 1;
}

message GetUserResponse {
  User user = 1;
  string error = 2;
}

message UpdateUserRequest {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  int32 age = 4;
}

message UpdateUserResponse {
  User user = 1;
  string error = 2;
}

message DeleteUserRequest {
  uint64 id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string error = 2;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message ListUsersResponse {
  int32 total = 1;
  repeated User users = 2;
  string error = 3;
}
